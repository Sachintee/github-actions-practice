name: Artifact Between Jobs

on:
  push:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate file
        run: |
          echo "Hello from Job 1" > job-output.txt
          echo "This file was passed as an artifact." >> job-output.txt

      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: job-output
          path: job-output.txt

  consume:
    needs: generate
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: job-output

      - name: Read artifact
        run: cat job-output.txt