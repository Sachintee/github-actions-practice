name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  file-size-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file sizes
        shell: bash
        run: |
          echo "Checking files for size greater than 1 MB..."

          oversized=0

          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file")

            if [ "$size" -gt 1048576 ]; then
              echo "File larger than 1 MB: $file"
              oversized=1
            fi
          done < <(find . -type f -not -path './.git/*' -print0)

          if [ "$oversized" -eq 1 ]; then
            echo "File size check failed."
            exit 1
          fi

          echo "All files are within the 1 MB limit."

  branch-name-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Checking branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" =~ ^(feature|fix|docs)/.+ ]]; then
            echo "Branch name is valid."
          else
            echo "Invalid branch name."
            echo "Use feature/*, fix/*, or docs/*"
            exit 1
          fi

  pr-body-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "::warning::PR description is empty."
          else
            echo "PR description is present."
          fi