name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Enter deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Print environment
        run: echo "Selected environment: ${{ inputs.environment }}"